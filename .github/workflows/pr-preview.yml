name: PR Preview

# A browser build of the app for a pull request, on the metrists-app Pages project's preview branch pr-<number>
# (https://pr-<number>.metrists-app.pages.dev), linked from one comment on the PR that each push updates.
#
# Who gets one, for now: PRs by the logins in the repository variable PR_PREVIEW_AUTHORS (comma-separated; unset, the
# build agent's bot), and any PR from this repository with the `preview` label. Fork PRs never do.
#
# The PR's code (a build agent's, say) runs only in `build`, which has no secrets and a read-only token. `deploy` holds
# the Cloudflare token and runs none of it: no checkout, only wrangler on the built files, without any Pages Functions
# the build might contain. A build agent can't edit this file: its GitHub App has no workflows permission.
#
# When the PR merges or closes, `remove` deletes every deployment on its preview branch, so the link stops working, and
# says so in the comment. A reopened PR builds a new one. It runs on `pull_request_target`: GitHub runs no `pull_request`
# workflow for a PR with merge conflicts, closing included, and a bot's PR often conflicts by the time it's closed. That
# event runs with this repository's secrets, which is safe here because `remove` runs none of the PR's code. A daily
# sweep removes the previews of any PR that closed without it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build preview
    if: >-
      github.event.action != 'closed' && github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(format(',{0},', vars.PR_PREVIEW_AUTHORS || 'notefig-build-agent[bot]'), format(',{0},', github.event.pull_request.user.login)) ||
      contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The dictation model is fetched by the Vite build (scripts/fetch-dictation-model.mjs);
      # cached so a run doesn't download its 132 MB again.
      - name: Cache dictation model
        uses: actions/cache@v4
        with:
          path: packages/desktop/node_modules/.cache/dictation-model
          key: ${{ runner.os }}-dictation-model-${{ hashFiles('packages/desktop/scripts/fetch-dictation-model.mjs') }}

      # No PostHog key (previews stay out of analytics) and no support URL (the support Worker only answers the app's
      # own origins).
      - name: Build the web app
        working-directory: packages/desktop
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: packages/desktop/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: preview
          path: dist

      # A `_worker.js` or `_routes.json` would make Pages run the build's own code as Functions, with the project's
      # bindings. Previews are static files only.
      - name: Keep the build static
        run: rm -rf dist/_worker.js dist/_routes.json

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist --project-name=metrists-app --branch=pr-${{ env.NUMBER }}
            --commit-hash=${{ github.event.pull_request.head.sha }} --commit-dirty=true

      - name: Link it from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # The branch alias stays the same across pushes; the deployment URL is this build's own.
          ALIAS: ${{ steps.pages.outputs.pages-deployment-alias-url }}
          DEPLOYMENT: ${{ steps.pages.outputs.deployment-url }}
        run: |
          MARKER='<!-- pr-preview -->'
          BODY="$MARKER
          **Preview:** ${ALIAS:-$DEPLOYMENT}

          The app in browser mode, built from ${SHA::7} (this build alone: $DEPLOYMENT). Workspaces you open in it stay in this browser."
          ID=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")))][0].id // empty" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$BODY" >/dev/null
          fi

  remove:
    name: Remove previews
    # Every PR from this repository, not only those the gate above lets in now: a label taken off later, or an author
    # dropped from the list, would otherwise leave a preview behind. One without any has nothing to delete.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Listed first, deleted after: deleting while paging would shift the pages. `force` deletes a branch's aliased
      # (latest) deployment too, which takes pr-<number>.metrists-app.pages.dev down with it. A closed PR's own run
      # removes its own preview; the sweep, those of every PR that is no longer open.
      - name: Delete the previews of closed pull requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/metrists-app/deployments"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          MARKER='<!-- pr-preview -->'
          DEPLOYMENTS=()
          for ((PAGE = 1; ; PAGE++)); do
            RESPONSE=$(curl -fsS -H "$AUTH" "$API?env=preview&per_page=25&page=$PAGE")
            mapfile -t FOUND < <(jq -r \
              '.result[] | (.deployment_trigger.metadata.branch // "") as $b | select($b | test("^pr-[0-9]+$")) | "\($b[3:]) \(.id)"' \
              <<<"$RESPONSE")
            DEPLOYMENTS+=("${FOUND[@]}")
            [ "$(jq '.result | length' <<<"$RESPONSE")" -eq 25 ] || break
          done

          if [ -n "$NUMBER" ]; then
            CLOSED=("$NUMBER")
          else
            CLOSED=()
            for N in $(printf '%s\n' "${DEPLOYMENTS[@]}" | cut -d' ' -f1 | sort -un); do
              if [ "$(gh api "repos/$REPO/pulls/$N" --jq .state)" = closed ]; then CLOSED+=("$N"); fi
            done
          fi

          for N in "${CLOSED[@]}"; do
            COUNT=0
            for ID in $(printf '%s\n' "${DEPLOYMENTS[@]}" | awk -v n="$N" '$1 == n { print $2 }'); do
              curl -fsS -X DELETE -H "$AUTH" "$API/$ID?force=true" >/dev/null
              COUNT=$((COUNT + 1))
            done
            echo "Deleted $COUNT deployment(s) of pr-$N"
            COMMENT=$(gh api "repos/$REPO/issues/$N/comments" --paginate \
              --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")))][0].id // empty" | head -1)
            if [ -n "$COMMENT" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT" -f body="$MARKER
          **Preview:** removed when the pull request closed." >/dev/null
            fi
          done
