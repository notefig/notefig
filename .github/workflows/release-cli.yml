name: Release CLI Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.8.0)"
        required: true
        type: string
      prerelease:
        description: "Is this a prerelease?"
        required: false
        type: boolean
        default: false

jobs:
  bump-and-tag:
    name: Bump Version and Create Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in semver format (e.g., 0.8.0)"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Bump version in package.json
        working-directory: packages/cli
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Single-lockfile npm-workspaces monorepo: there is no
          # packages/cli/package-lock.json — only the root lock, which npm
          # version may refresh. Stage the CLI manifest plus the root lock
          # (a no-op if unchanged); never a nonexistent per-package lock.
          git add packages/cli/package.json package-lock.json
          git commit -m "cli: bump to v${{ inputs.version }}"
          # --no-verify: skip the repo's .githooks/pre-push, a local dev hook
          # that runs the desktop E2E suite. It has no place gating release
          # automation and crashes in CI (missing @tailwindcss/oxide native
          # binding), which fails the whole publish.
          git push --no-verify origin ${{ github.ref_name }}

      - name: Create and push tag
        run: |
          git tag "cli-v${{ inputs.version }}"
          git push --no-verify origin "cli-v${{ inputs.version }}"

  publish-npm:
    name: Publish to npm
    needs: bump-and-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "cli-v${{ inputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node's bundled
      # npm can lag behind that.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # The CLI's `lib/shared.ts` re-exports @notefig/shared, which resolves
      # through its package.json `exports` to ./dist. A fresh `npm ci` does not
      # build workspace packages, so shared/dist is absent and the CLI's tsc
      # (and esbuild vendoring) fail with "Cannot find module @notefig/shared".
      # Build shared first.
      - name: Build shared workspace
        run: npm run build -w @notefig/shared

      - name: Build CLI
        working-directory: packages/cli
        run: npm run build

      # Authenticates via OIDC trusted publishing (no NPM_TOKEN) and attaches
      # provenance automatically.
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --access public

      - name: Pack tarball for GitHub release
        working-directory: packages/cli
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-tarball
          path: packages/cli/notefig-${{ inputs.version }}.tgz

  create-release:
    name: Create GitHub Release
    needs: [bump-and-tag, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "cli-v${{ inputs.version }}"

      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-tarball

      # Draft-first so a re-run after a partial failure doesn't collide with
      # an already-published, now-immutable release.
      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "cli-v${{ inputs.version }}" --repo ${{ github.repository }} || \
          gh release create "cli-v${{ inputs.version }}" \
            --repo ${{ github.repository }} \
            --title "CLI v${{ inputs.version }}" \
            --draft \
            --notes "## CLI Release v${{ inputs.version }}

          This release contains the CLI package published to npm.

          **Installation:**
          \`\`\`bash
          npm install -g notefig@${{ inputs.version }}
          \`\`\`

          **Verify this release:**
          \`\`\`bash
          gh release verify-asset cli-v${{ inputs.version }} notefig-${{ inputs.version }}.tgz -R ${{ github.repository }}
          \`\`\`

          **Changelog:**
          See commits since last release."

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "cli-v${{ inputs.version }}" "notefig-${{ inputs.version }}.tgz" --repo ${{ github.repository }} --clobber

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "cli-v${{ inputs.version }}" --repo ${{ github.repository }} --draft=false --prerelease=${{ inputs.prerelease }}
