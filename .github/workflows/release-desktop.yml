name: Release Desktop App

# Two modes, selected by the version input:
#   "0.0.93"        — normal release: bump committed to main, tagged, published
#                     as the latest release the in-app updater serves.
#   "0.0.93-debug"  — debug build of current main: `tauri build --debug`
#                     (devtools enabled, debug assertions on). Nothing is
#                     committed or tagged on main, deploy-web is skipped, and
#                     the release is published as a prerelease with
#                     --latest=false. The updater endpoint is
#                     releases/latest/download/latest.json, and GitHub never
#                     serves prerelease/non-latest releases there, so debug
#                     builds can never reach the regular update cycle.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.0.3, or 0.0.3-debug for a debug build)"
        required: true
        type: string

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the release-notes assembly walks merges since the
          # previous desktop-v* tag.
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-debug)?$'; then
            echo "Error: Version must be semver (e.g. 0.0.3) or semver-debug (e.g. 0.0.3-debug)"
            exit 1
          fi

      # The version's release notes ship inside the app (the release-notes
      # tab bundles release-notes/*.md) and become the GitHub release body
      # and latest.json notes. A hand-written release-notes/v<version>.md
      # committed beforehand wins; otherwise the file is assembled from the
      # "## Release notes" sections of every PR merged since the previous
      # release. No file and no PR entries fails the release.
      - name: Assemble release notes
        if: ${{ !contains(inputs.version, '-debug') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          NOTES_FILE="packages/desktop/release-notes/v${VERSION}.md"
          if [ -s "$NOTES_FILE" ]; then
            echo "Using hand-written $NOTES_FILE"
            cat "$NOTES_FILE"
            exit 0
          fi

          PREV_TAG=$(git tag -l 'desktop-v*' --sort=-v:refname | grep -v -- '-debug' | head -1)
          echo "Collecting entries from PRs merged since ${PREV_TAG:-the beginning}"
          RANGE=${PREV_TAG:+$PREV_TAG..HEAD}

          ENTRIES=""
          for PR in $(git log $RANGE --merges --pretty=%s | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+'); do
            SECTION=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r' | \
              awk '/^##[[:space:]]+[Rr]elease notes/{found=1; next} /^##[[:space:]]/{found=0} found' | \
              perl -0pe 's/<!--.*?-->//gs' | sed '/^[[:space:]]*$/d' | \
              grep -viE '^[-*[:space:]]*_*none_*\.?$' || true)
            if [ -n "$SECTION" ]; then
              echo "PR #$PR:"; echo "$SECTION"
              ENTRIES="${ENTRIES}${SECTION}"$'\n'
            fi
          done

          if [ -z "$ENTRIES" ]; then
            echo "::error::No release notes for v${VERSION}: ${NOTES_FILE} does not exist and no PR merged since ${PREV_TAG:-repo start} carries a '## Release notes' section with entries. Commit the file by hand or add notes to the PRs, then re-run."
            exit 1
          fi

          mkdir -p packages/desktop/release-notes
          {
            echo "# Release Notes v${VERSION}"
            echo
            printf '%s' "$ENTRIES"
          } > "$NOTES_FILE"
          echo "Assembled $NOTES_FILE:"
          cat "$NOTES_FILE"

      # Debug builds never touch main: no bump commit, no tag. The build job
      # stamps the version into its own checkout instead.
      - name: Bump version in package.json
        if: ${{ !contains(inputs.version, '-debug') }}
        working-directory: packages/desktop
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' package.json

      - name: Bump version in Cargo.toml
        if: ${{ !contains(inputs.version, '-debug') }}
        working-directory: packages/desktop/src-tauri
        run: |
          sed -i '0,/^version = "[^"]*"/s//version = "${{ inputs.version }}"/' Cargo.toml

      - name: Bump version in tauri.conf.json
        if: ${{ !contains(inputs.version, '-debug') }}
        working-directory: packages/desktop/src-tauri
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' tauri.conf.json

      - name: Update Cargo.lock
        if: ${{ !contains(inputs.version, '-debug') }}
        working-directory: packages/desktop/src-tauri
        run: |
          rustup default stable
          cargo update --workspace

      - name: Commit version bump
        if: ${{ !contains(inputs.version, '-debug') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/package.json packages/desktop/src-tauri/Cargo.toml packages/desktop/src-tauri/tauri.conf.json packages/desktop/src-tauri/Cargo.lock "packages/desktop/release-notes/v${{ inputs.version }}.md"
          git commit -m "desktop: bump to v${{ inputs.version }}"
          git push origin main

      - name: Create and push tag
        if: ${{ !contains(inputs.version, '-debug') }}
        run: |
          git tag "desktop-v${{ inputs.version }}"
          git push origin "desktop-v${{ inputs.version }}"

  deploy-web:
    needs: bump-and-tag
    if: ${{ !contains(inputs.version, '-debug') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "desktop-v${{ inputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: packages/desktop
        run: npm install

      - name: Build web version
        working-directory: packages/desktop
        run: npm run build

      - name: Create updater manifest for web
        working-directory: packages/desktop
        run: |
          jq -n \
            --arg version "${{ inputs.version }}" \
            --arg notes "$(cat "release-notes/v${{ inputs.version }}.md")" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}' \
            > dist/latest.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=metrists-app --branch=main --commit-dirty=true
          workingDirectory: packages/desktop

  build:
    needs: bump-and-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            id: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            id: macos-x86_64
          # - platform: ubuntu-22.04
          #   args: --bundles deb,appimage
          #   id: linux
          # - platform: windows-latest
          #   args: ""
          #   id: windows

    runs-on: ${{ matrix.platform }}

    steps:
      # Debug builds have no tag — they build whatever main currently is.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ contains(inputs.version, '-debug') && 'main' || format('desktop-v{0}', inputs.version) }}

      # For debug builds the version was never committed, so stamp it into
      # this checkout only (BSD sed on macOS runners — hence perl).
      - name: Stamp debug version
        if: ${{ contains(inputs.version, '-debug') }}
        run: |
          perl -pi -e 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' packages/desktop/package.json
          perl -pi -e '$done ||= s/^version = "[^"]*"/version = "${{ inputs.version }}"/' packages/desktop/src-tauri/Cargo.toml
          perl -pi -e 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' packages/desktop/src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: packages/desktop
        run: npm install

      # The bundled notes file doubles as the GitHub release body (and, via
      # tauri-action's updater manifest, latest.json's `notes` — what the
      # in-app update toast receives as update.body). Failing `cat` here also
      # backstops a tag that somehow lacks the file.
      - name: Read release notes
        id: notes
        if: ${{ !contains(inputs.version, '-debug') }}
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat "packages/desktop/release-notes/v${{ inputs.version }}.md"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # PostHog telemetry (opt-in, see packages/desktop/TELEMETRY.md).
          # Absent secrets = telemetry fully disabled in the built app.
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        with:
          projectPath: packages/desktop
          tagName: "desktop-v${{ inputs.version }}"
          releaseName: ${{ contains(inputs.version, '-debug') && format('Metrists Desktop v{0} (debug build)', inputs.version) || format('Metrists Desktop v{0}', inputs.version) }}
          releaseBody: ${{ contains(inputs.version, '-debug') && 'Debug build with devtools enabled — not for regular use. The in-app updater never serves this version.' || steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(inputs.version, '-debug') }}
          includeDebug: ${{ contains(inputs.version, '-debug') }}
          includeRelease: ${{ !contains(inputs.version, '-debug') }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only after every matrix leg has uploaded its bundles does the release
      # go non-draft — this is also the moment latest.json starts serving the
      # new version to the in-app updater, so partially-uploaded releases are
      # never visible to it. Debug releases stay prerelease and are published
      # with --latest=false, which keeps them out of
      # releases/latest/download/latest.json entirely.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.version }}" == *-debug ]]; then
            gh release edit "desktop-v${{ inputs.version }}" --repo ${{ github.repository }} --draft=false --prerelease --latest=false
          else
            gh release edit "desktop-v${{ inputs.version }}" --repo ${{ github.repository }} --draft=false --latest
          fi
