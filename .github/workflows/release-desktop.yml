name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.0.3)"
        required: true
        type: string

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in semver format (e.g. 0.0.3)"
            exit 1
          fi

      - name: Bump version in package.json
        working-directory: packages/desktop
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' package.json

      - name: Bump version in Cargo.toml
        working-directory: packages/desktop/src-tauri
        run: |
          sed -i '0,/^version = "[^"]*"/s//version = "${{ inputs.version }}"/' Cargo.toml

      - name: Bump version in tauri.conf.json
        working-directory: packages/desktop/src-tauri
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' tauri.conf.json

      - name: Update Cargo.lock
        working-directory: packages/desktop/src-tauri
        run: |
          rustup default stable
          cargo update --workspace

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/package.json packages/desktop/src-tauri/Cargo.toml packages/desktop/src-tauri/tauri.conf.json packages/desktop/src-tauri/Cargo.lock
          git commit -m "desktop: bump to v${{ inputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          git tag "desktop-v${{ inputs.version }}"
          git push origin "desktop-v${{ inputs.version }}"

  build-and-publish:
    needs: bump-and-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # - platform: ubuntu-22.04
          #   args: --bundles deb,appimage
          # - platform: windows-latest
          #   args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "desktop-v${{ inputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: packages/desktop
        run: npm install

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: "desktop-v${{ inputs.version }}"
          releaseName: "Metrists Desktop v${{ inputs.version }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
