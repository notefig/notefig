name: Config Schema Sync and Contract

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "packages/shared/src/config/**"
      - "packages/shared/scripts/generate-project-config-schema.js"
      - "packages/shared/package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "packages/shared/src/config/**"
      - "packages/shared/scripts/generate-project-config-schema.js"
      - "packages/shared/package.json"
      - "package-lock.json"

jobs:
  schema-sync:
    name: Schema Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate schema
        run: npm run schema:generate

      - name: Auto-commit generated schema
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- schemas/project-config/v1.schema.json; then
            echo "No schema changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/project-config/v1.schema.json
          git commit -m "chore(schema): regenerate project config schema"
          git push

      - name: Enforce clean schema on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- schemas/project-config/v1.schema.json; then
            exit 0
          fi

          echo "Schema changed but pull_request runs do not push commits."
          echo "Run 'npm run schema:generate' locally and commit schemas/project-config/v1.schema.json."
          exit 1
