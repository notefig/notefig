name: CI - Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-cli-build:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build CLI
        run: npm run build -w packages/cli

      - name: Sync themes
        run: npm run sync-themes

  test-cli-integration:
    name: Test CLI
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test-cli-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build CLI
        run: npm run build -w packages/cli

      - name: Sync themes
        run: npm run sync-themes

      - name: Run CLI integration tests
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: npm run test -w packages/cli

  test-git:
    name: Test Git Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify git availability
        run: git --version

      - name: Run git package tests
        run: npm run test -w packages/git

  test-desktop-unit:
    name: Test Desktop (Unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The release build is `tsc && vite build`; vitest does not typecheck,
      # so without this a type error can pass CI and fail the release.
      - name: Typecheck Desktop
        working-directory: packages/desktop
        run: npx tsc --noEmit

      - name: Run Desktop unit tests
        working-directory: packages/desktop
        run: npm run test:unit

  test-desktop-e2e:
    name: Test Desktop (E2E ${{ matrix.shard }}/4)
    # All three browser suites (chromium, editor, agent), split across four
    # runners. Each shard boots its own dev server and runs two workers
    # (playwright.config.ts); the merge job below stitches the shards'
    # blob reports into one HTML report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        working-directory: packages/desktop
        run: npx playwright install --with-deps chromium

      - name: Run Desktop E2E tests
        working-directory: packages/desktop
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-report-${{ matrix.shard }}
          path: packages/desktop/blob-report
          retention-days: 1

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: packages/desktop/test-results
          retention-days: 7

  merge-desktop-e2e-reports:
    name: Merge Desktop E2E reports
    needs: test-desktop-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: packages/desktop/all-blob-reports
          pattern: e2e-blob-report-*
          merge-multiple: true

      - name: Merge into an HTML report
        working-directory: packages/desktop
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report
          path: packages/desktop/playwright-report
          retention-days: 14

  test-desktop-tauri:
    name: Test Desktop (Tauri)
    # The windows-latest leg is the only continuous Windows compile/test signal
    # (MET-157) — without it every Windows breakage is invisible until release.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      # tauri-build verifies every `bundle.externalBin` entry exists for the
      # target triple, so the sidecar executables (MET-210) must be built
      # before anything compiles the Tauri crate.
      - name: Build sidecars
        working-directory: packages/desktop
        run: node scripts/build-sidecars.mjs

      - name: Run Tauri tests
        working-directory: packages/desktop/src-tauri
        run: cargo test

  test-desktop-shim:
    name: Test Desktop (real-backend shim)
    # The windows-latest leg is the Phase-2 acceptance gate for MET-157: the
    # real frontend against the real Rust backend on NTFS — fs ops, tree,
    # external-change adoption, editor round-trips — with no bundle/signing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            playwright-cache: ~/.cache/ms-playwright
          - platform: windows-latest
            playwright-cache: ~\AppData\Local\ms-playwright
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      # The shim lives in the Tauri workspace, whose build script checks the
      # sidecar executables exist (see the Tauri job above).
      - name: Build sidecars
        working-directory: packages/desktop
        run: node scripts/build-sidecars.mjs

      # Compile the shim OUTSIDE Playwright's webServer timeout — a cold
      # workspace build takes well past the old 180s (both legs timed out on
      # the first PR run); after this step `cargo run -p test-shim` is a
      # no-op rebuild.
      - name: Build test shim
        working-directory: packages/desktop/src-tauri
        run: cargo build -p test-shim

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ matrix.playwright-cache }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        working-directory: packages/desktop
        run: npx playwright install --with-deps chromium

      # Real UI → real Rust fs_ops/search → real filesystem, via the test-shim
      # binary (MET-73). The webServers (shim + shim-mode Vite) are started by
      # playwright.shim.config.ts.
      - name: Run shim-backed E2E smoke
        working-directory: packages/desktop
        run: npm run test:e2e:shim

  fallow-audit:
    name: Fallow Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # fallow (pinned in root package.json, picked up by the action)
          # requires Node >= 22
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: fallow-rs/fallow@v3
        id: fallow
        with:
          command: audit
          format: json
          fail-on-issues: true
          gate: new-only
          auto-changed-since: true
          annotations: true
          comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The rendered surfaces (annotations/comment) don't always show every
      # gating finding — keep the raw results inspectable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fallow-audit-results
          path: |
            fallow-results.json
            fallow-results-scoped.json
          if-no-files-found: ignore

  fallow-health:
    name: Fallow Health (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # fallow (pinned in root package.json, picked up by the action)
          # requires Node >= 22
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: fallow-rs/fallow@v3
        with:
          command: health
          format: sarif
          fail-on-issues: false
          max-crap: 50
          score: true

  lint-cli:
    name: Lint CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        working-directory: packages/cli
        run: npm run lint
