name: CI - Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build CLI
        run: npm run build -w packages/cli

      - name: Sync themes
        run: npm run sync-themes

      - name: Run CLI tests
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: npm run test -w packages/cli

  test-git:
    name: Test Git Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify git availability
        run: git --version

      - name: Run git package tests
        run: npm run test -w packages/git

  test-desktop-unit:
    name: Test Desktop (Unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Desktop unit tests
        working-directory: packages/desktop
        run: npm run test:unit

  test-desktop-e2e:
    name: Test Desktop
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        working-directory: packages/desktop
        run: npx playwright install --with-deps chromium

      - name: Run Desktop E2E tests (smoke on PR, full on main)
        working-directory: packages/desktop
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:e2e -- --project=chromium --grep "@smoke"
          else
            npm run test:e2e -- --project=chromium
          fi

  test-desktop-tauri:
    name: Test Desktop (Tauri)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run Tauri tests
        working-directory: packages/desktop/src-tauri
        run: cargo test

  fallow-audit:
    name: Fallow Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: fallow-rs/fallow@v2
        id: fallow
        with:
          command: audit
          format: json
          fail-on-issues: true
          gate: new-only
          auto-changed-since: true
          annotations: true
          comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  fallow-health:
    name: Fallow Health (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: fallow-rs/fallow@v2
        with:
          command: health
          format: sarif
          fail-on-issues: false
          max-crap: 50
          score: true

  lint-cli:
    name: Lint CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        working-directory: packages/cli
        run: npm run lint
