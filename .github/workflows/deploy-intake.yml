name: Deploy Intake Worker

# Deploys packages/intake (the feedback intake Worker) to Cloudflare on every
# push to main that touches it. Secrets the Worker reads at runtime are set
# once with `wrangler secret put` (packages/intake/README.md), not here.
on:
  push:
    branches: [main]
    paths:
      - "packages/intake/**"
      - "packages/shared/src/intake/**"
      - ".github/workflows/deploy-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-intake
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run build -w packages/intake && npm run test -w packages/intake

      - name: Deploy
        working-directory: packages/intake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
