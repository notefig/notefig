[workspace]
# The e2e shim (MET-73) lives in its own crate, not a second `[[bin]]` here:
# tauri-bundler enumerates every `[[bin]]` in this package when bundling,
# ignoring `required-features`, so a shim binary gated by a feature and left
# unbuilt in a normal release build broke `tauri build`. A separate workspace
# member is invisible to bundling of this package and only gets built when
# something asks for it by name (`cargo run -p test-shim`).
members = ["test-shim"]

[package]
name = "notefig"
version = "0.0.154"
description = "Notefig desktop app backend"
authors = ["Parsa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-fs = "3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros", "rt", "net"] }
futures = "0.3"
notify = "6.1"
notify-debouncer-full = "0.3"
# `bundled` pins the SQLite build rather than inheriting whatever the host has:
# the persistence schema uses json_extract (JSON1), and a system SQLite older
# than 3.38 would fail at runtime on some Linux targets only.
rusqlite = { version = "0.40", features = ["bundled"] }
lazy_static = "1.4"
md5 = "0.8.0"
# OS randomness for the MCP bridge's per-task connection token
getrandom = "0.2"
# Search functionality - ripgrep's search engine
grep = "0.3"
grep-regex = "0.1"
regex = "1.10"

# Tauri 3 no longer picks a webview runtime itself: main.rs selects one with
# `Builder::runtime`, and the CLI/bundler ship whichever of these the target
# depends on. macOS and Windows render with CEF's bundled Chromium instead of
# WKWebView / WebView2. Its `cef` re-export has no stability guarantee; the
# lockfile pins it.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-runtime-cef = "3.0.0-alpha.6"

# Linux stays on WebKitGTK for now: tauri-bundler 3.0.0-alpha.4 copies
# libEGL.so / libGLESv2.so into every deb/rpm/AppImage, and the CEF 154 this
# runtime pins no longer ships them, so no Linux package can be built.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-wry = "3.0.0-alpha.5"

[target.'cfg(target_os = "macos")'.dependencies]
# The menu-bar item (app_status.rs). macOS only: a template icon is a
# macOS idiom, and the Linux tray would add a libappindicator link.
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset", "tray-icon"] }
# Traffic-light pinning (traffic_lights.rs): reaches the standard window
# buttons through AppKit. Same objc2 line tauri itself links.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "3.0.0-alpha.2"

[target.'cfg(unix)'.dependencies]
# killpg for agent process-group teardown (agent_proc.rs) — SIGKILLing only
# the direct child orphans the npx → adapter → claude CLI grandchildren.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects for agent process-tree teardown (agent_proc.rs) — Windows has
# no process groups; JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE kills the whole
# npx → adapter → CLI tree when the job handle closes (covers app crash too).
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_Security",
  # JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds IO_COUNTERS, which lives in
  # (and feature-gates on) the Threading module.
  "Win32_System_Threading",
  # Live registry PATH read (agent_proc.rs win_env) — a GUI app's inherited
  # PATH is a stale snapshot from Explorer startup (MET-158).
  "Win32_System_Registry",
  "Win32_System_Environment",
] }

[dev-dependencies]
tempfile = "3"
# Same version tauri-utils uses — needed to hand-build a resolved ACL entry
# (`ResolvedCommand.windows: Vec<glob::Pattern>`) in tests/budgets.rs.
glob = "0.3"
# Gates `tauri::test::mock_builder`/`MockRuntime` for the command-dispatch
# tests (MET-73). Test-only so it never ships in the app binary.
tauri = { version = "3.0.0-alpha.5", features = ["test"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
cargo-clippy = []
