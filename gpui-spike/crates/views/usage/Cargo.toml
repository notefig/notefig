[package]
name = "notefig-view-usage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Views ported from packages/desktop/src/components/agent/usage-settings.tsx, usage-*-chart.tsx, session-usage.tsx. Owner: git."

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
notefig-core.workspace = true
notefig-ui = { path = "../../ui" }
notefig-i18n = { path = "../../modules/i18n" }
notefig-usage = { path = "../../modules/usage" }
notefig-agent = { path = "../../notefig-agent" }
notefig-agents = { path = "../../modules/agents" }
notefig-harness-adapters = { path = "../../modules/harness-adapters" }
notefig-view-settings = { path = "../settings" }
# `harness_logo`, as the TS `HarnessLogo`.
notefig-view-agent = { path = "../agent" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
notefig-core = { workspace = true, features = ["testing"] }
notefig-platform = { workspace = true, features = ["fake"] }

[features]
# `cargo run --example usage --features screenshot`: the driver's `shot:` step.
screenshot = ["notefig-ui/screenshot"]

[[example]]
name = "usage"
path = "examples/usage.rs"
