[package]
name = "notefig-view-updater"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Views ported from components/app-updater.tsx (the settings UpdaterButton face, the update toasts) and components/release-notes-tab.tsx. Owner: platform-extras."

[dependencies]
gpui.workspace = true
gpui-kit.workspace = true
notefig-core.workspace = true
notefig-ui = { path = "../../ui" }
notefig-i18n = { path = "../../modules/i18n" }
notefig-updater = { path = "../../modules/updater" }
gpui-kit-markdown-editor = { path = "../../markdown-editor" }

[dev-dependencies]
notefig-kv = { path = "../../modules/kv" }
notefig-telemetry = { path = "../../modules/telemetry" }
notefig-platform = { workspace = true, features = ["fake"] }

[features]
screenshot = ["notefig-ui/screenshot"]
