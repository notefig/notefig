[package]
name = "notefig-view-command-palette"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Views ported from packages/desktop/src/components/editor/command-palette.tsx. Owner: settings."

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
serde_json.workspace = true
async-channel = "2"
notefig-core.workspace = true
notefig-platform.workspace = true
notefig-ui = { path = "../../ui" }
notefig-i18n = { path = "../../modules/i18n" }
notefig-feedback = { path = "../../modules/feedback" }
notefig-view-settings = { path = "../settings" }
notefig-files = { path = "../../modules/files" }
notefig-editors = { path = "../../modules/editors" }
notefig-workspaces = { path = "../../modules/workspaces" }
notefig-view-file-tree = { path = "../file-tree" }

[dev-dependencies]
notefig-core = { workspace = true, features = ["testing"] }
notefig-platform = { workspace = true, features = ["fake"] }
notefig-platform-native = { path = "../../platform-native" }
notefig-kv = { path = "../../modules/kv" }
notefig-telemetry = { path = "../../modules/telemetry" }

[features]
screenshot = ["notefig-ui/screenshot", "notefig-view-settings/screenshot"]
