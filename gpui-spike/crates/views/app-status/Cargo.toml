[package]
name = "notefig-view-app-status"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The menu-bar item for notefig-app-status (src-tauri/src/app_status.rs's tray). Owner: platform-extras."

[dependencies]
gpui.workspace = true
notefig-core.workspace = true
notefig-ui = { path = "../../ui" }
notefig-app-status = { path = "../../modules/app-status" }
async-channel = "2"
serde.workspace = true
serde_json.workspace = true
notefig-i18n = { path = "../../modules/i18n" }
notefig-agents = { path = "../../modules/agents" }
notefig-prompt-rounds = { path = "../../modules/prompt-rounds" }
notefig-attention = { path = "../../modules/attention" }
notefig-seen = { path = "../../modules/seen" }
notefig-recent-documents = { path = "../../modules/recent-documents" }
notefig-scratchpads = { path = "../../modules/scratchpads" }
notefig-tabs = { path = "../../modules/tabs" }
notefig-workspaces = { path = "../../modules/workspaces" }
notefig-view-agent = { path = "../agent" }
notefig-view-settings = { path = "../settings" }
notefig-view-welcome = { path = "../welcome" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
gpui-kit.workspace = true
notefig-platform = { workspace = true, features = ["fake"] }

[features]
screenshot = ["notefig-ui/screenshot"]
