description = "Dictation's GPUI side: the right-hand hold-key monitor, Escape, the editor target and the indicator (packages/widgets/src/dictation). Owner: platform-extras."

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
gpui.workspace = true
