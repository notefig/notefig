[package]
name = "notefig-history"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Notefig's hidden document-history (checkpoint) repo at <ws>/.notefig/.git, on gix (no gpui)."

[dependencies]
gix = { version = "0.90", default-features = false, features = ["index", "revision", "sha1"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
