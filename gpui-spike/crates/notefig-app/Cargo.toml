[package]
name = "notefig-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Notefig on GPUI: the app shell (composition root)."

[[bin]]
name = "notefig-legacy"
path = "src/main.rs"

[lib]
name = "notefig_app"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui-kit = { workspace = true, features = ["syntect"] }
markdown-editor = { package = "gpui-kit-markdown-editor", path = "../markdown-editor" }
notefig-workspace = { path = "../notefig-workspace" }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
notefig-agent = { path = "../notefig-agent" }
notefig-history = { path = "../notefig-history" }
async-channel = "2"
# `--features screenshot`: NOTEFIG_SCREENSHOT=<png> renders the window to a file.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", optional = true, features = ["test-support"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
screenshot = ["dep:gpui-platform", "dep:image", "gpui/test-support"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["syntect", "test-support"] }
tempfile = "3"
smol = "2"
