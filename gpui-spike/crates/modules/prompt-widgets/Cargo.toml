[package]
name = "notefig-prompt-widgets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of packages/desktop/src/modules/prompt-widgets (and the non-view half of @notefig/widgets' prompt service). Owner: agents."

[features]
testing = []

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
notefig-core.workspace = true
notefig-platform.workspace = true
notefig-agent = { path = "../../notefig-agent" }
notefig-agents = { path = "../agents" }

[dev-dependencies]
notefig-core = { workspace = true, features = ["testing"] }
notefig-platform = { workspace = true, features = ["fake"] }
