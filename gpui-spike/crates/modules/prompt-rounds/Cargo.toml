description = "Port of packages/desktop/src/modules/prompt-rounds. Owner: agents."

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
notefig-core.workspace = true
notefig-platform.workspace = true
notefig-agent = { path = "../../notefig-agent" }
