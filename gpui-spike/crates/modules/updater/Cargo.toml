[package]
name = "notefig-updater"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of components/app-updater.tsx (state), the PlatformUpdater surface, utils/release-notes.ts and hooks/use-release-notes-on-update.ts. Owner: platform-extras."

[dependencies]
notefig-platform.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
notefig-core.workspace = true
notefig-kv = { path = "../kv" }
notefig-telemetry = { path = "../telemetry" }

[dev-dependencies]
notefig-core = { workspace = true, features = ["testing"] }
notefig-platform = { workspace = true, features = ["fake"] }
