[package]
name = "notefig-usage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of packages/desktop/src/modules/usage. Owner: git."

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
notefig-core.workspace = true
notefig-platform.workspace = true
# The shared usage types (`@notefig/shared/agent`'s usage.ts, ids.ts).
notefig-agent = { path = "../../notefig-agent" }
# The `"agent:usage"` and `"agent:usage-limits"` hooks.
notefig-agents = { path = "../agents" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
notefig-core = { workspace = true, features = ["testing"] }
notefig-platform = { workspace = true, features = ["fake"] }
