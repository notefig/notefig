[package]
name = "notefig-dictation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of packages/dictation and packages/desktop/src/modules/dictation: push-to-talk dictation. Owner: platform-extras."

[features]
default = ["native-mic", "onnx"]
# Speech inference on onnxruntime (`ort` downloads its runtime once, at build).
onnx = ["dep:ort"]
# The desktop microphone on cpal (CoreAudio / WASAPI / ALSA).
native-mic = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
notefig-core.workspace = true
notefig-platform.workspace = true
notefig-kv = { path = "../kv" }
sha2 = "0.10"
async-channel = "2"
cpal = { version = "0.16", optional = true }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }

[dev-dependencies]
notefig-core = { workspace = true, features = ["testing"] }
notefig-platform = { workspace = true, features = ["fake"] }
