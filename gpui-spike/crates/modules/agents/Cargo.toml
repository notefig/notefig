[package]
name = "notefig-agents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of packages/desktop/src/modules/agents. Owner: agents."

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
notefig-core.workspace = true
notefig-platform.workspace = true
notefig-agent = { path = "../../notefig-agent" }
notefig-harness-adapters = { path = "../harness-adapters" }
notefig-kv = { path = "../kv" }
notefig-documents = { path = "../documents" }
notefig-tabs = { path = "../tabs" }
notefig-tunnel = { path = "../tunnel" }
smol = "2"
async-channel = "2"
md5 = "0.8"

[dev-dependencies]
notefig-core = { workspace = true, features = ["testing"] }
notefig-platform = { workspace = true, features = ["fake"] }
tempfile = "3"
notefig-layout = { path = "../layout" }
notefig-platform-native = { path = "../../platform-native" }

