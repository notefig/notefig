[package]
name = "web-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Not a workspace member: a compile probe for the web (wasm32) target.
[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
gpui-kit = { version = "=0.8.0", default-features = false }
gpui-kit-markdown-editor = { path = "../../crates/markdown-editor", default-features = false }
